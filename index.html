<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernreise · Nationalsozialismus & Zweiter Weltkrieg</title>
<style>
:root{
  /* Ruhige, zurückhaltende Apple-Palette: neutrale Flächen, ein Interaktions-Blau, gedämpfte Akzente */
  --brand:#33415c; --brand2:#4a5a78;
  --maroon:#33415c; --maroon2:#4a5a78; --pink:#eaeef4;   /* Aliase: alte Namen -> neue Töne */
  --blue:#0071e3; --blue-l:#e7f1fd;
  --green:#1f8a3b; --green-l:#e8f5ec;
  --yellow:#b06a00; --yellow-l:#fbf1dd;
  --purple:#6b4fa0; --teal:#0a7a68;
  --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.10);
  --paper:#f5f5f7; --card:#ffffff; --sand:#eef1f6;
  --r:20px; --r-s:14px;
  --sh:0 1px 1px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --sh-h:0 6px 16px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
  --maxw:1060px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color:var(--ink); background:var(--paper); font-size:17px; line-height:1.5;
  letter-spacing:-.003em; -webkit-font-smoothing:antialiased; font-optical-sizing:auto;
}
h1,h2,h3{line-height:1.06; margin:0; letter-spacing:-.021em}
h1{letter-spacing:-.03em}
a{color:var(--blue)}
button{font-family:inherit}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:50;
  background:rgba(28,32,44,.68);
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  color:#fff; border-bottom:1px solid rgba(255,255,255,.12);
}
.top .wrap{display:flex; align-items:center; gap:16px; padding-top:12px; padding-bottom:12px}
.brand{display:flex; flex-direction:column; min-width:0}
.brand b{font-weight:650; font-size:1.02rem; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand span{font-size:.78rem; opacity:.85}
.progress{flex:1; min-width:80px}
.progress .bar{height:9px; background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden}
.progress .fill{height:100%; width:0%; background:linear-gradient(90deg,#ffd27a,#ffe8b0); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress small{opacity:.9; font-size:.72rem}
.btn-home{background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:9px 16px; font-size:.9rem; cursor:pointer; white-space:nowrap; transition:transform .12s ease, background .2s}
.btn-home:active{transform:scale(.96)}
.btn-home:hover{background:rgba(255,255,255,.28)}

/* ---------- Hero ---------- */
.hero{padding:56px 0 30px; text-align:center}
.hero .kicker{color:var(--maroon2); font-weight:650; letter-spacing:.02em; text-transform:uppercase; font-size:.8rem}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem); margin:10px 0 14px}
.hero .lead{max-width:640px; margin:0 auto; color:var(--muted); font-size:1.12rem}
.legend{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:24px 0 4px}
.legend .tag{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:7px 14px; font-size:.85rem; box-shadow:var(--sh)}
.legend .tag b{font-weight:650}

/* ---------- Einstufungstest (Station 0) ---------- */
.est-btn{display:flex; align-items:center; gap:18px; width:100%; text-align:left; cursor:pointer;
  background:linear-gradient(135deg,#33415c,#4a5a78); color:#fff; border:none; border-radius:var(--r);
  padding:22px 26px; box-shadow:var(--sh); transition:transform .18s var(--ease), box-shadow .18s var(--ease); margin:6px 0 4px}
.est-btn:hover{transform:translateY(-3px); box-shadow:var(--sh-h)}
.est-btn:active{transform:translateY(-1px) scale(.995)}
.est-btn .ic{font-size:2.2rem; flex:none}
.est-btn h3{font-size:1.28rem; margin:0 0 3px; color:#fff}
.est-btn p{margin:0; opacity:.9; font-size:.95rem}
.est-btn .go{margin-left:auto; flex:none; background:rgba(255,255,255,.18); border-radius:99px; padding:10px 16px; font-size:.9rem; white-space:nowrap}
.est-btn .done-badge{margin-left:auto; flex:none; background:#1f8a3b; border-radius:99px; padding:8px 15px; font-size:.88rem; font-weight:600; white-space:nowrap}
.est-wrap{padding:26px 0 90px; animation:fade .35s ease}
.est-q{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; box-shadow:var(--sh); margin:14px 0}
.est-q .qh{font-weight:600; margin-bottom:12px}
.est-opts{display:grid; gap:10px}
.est-opt{border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:12px 15px; cursor:pointer; font-size:1rem; transition:transform .1s var(--ease), border-color .2s, background .2s; text-align:left}
.est-opt:hover{border-color:var(--brand2)}
.est-opt:active{transform:scale(.99)}
.est-opt.sel{border-color:var(--brand); background:var(--sand)}
.est-result{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:26px; box-shadow:var(--sh); margin-top:16px; text-align:center; display:none}
.est-result.show{display:block; animation:fade .3s ease}
.est-result .badge{display:inline-block; font-size:1.05rem; font-weight:700; padding:10px 20px; border-radius:99px; margin:10px 0}
.est-result .b1{background:var(--green-l); color:var(--green)}
.est-result .b2{background:var(--yellow-l); color:var(--yellow)}
.est-result .b3{background:var(--blue-l); color:var(--blue)}

/* ---------- Map grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding:20px 0 60px}
.tile{position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px; cursor:pointer; box-shadow:var(--sh); transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s; overflow:hidden; text-align:left}
.tile:hover{transform:translateY(-4px); box-shadow:var(--sh-h)}
.tile:active{transform:translateY(-1px) scale(.995)}
.tile .accent{position:absolute; inset:0 auto 0 0; width:6px}
.tile .ic{font-size:2rem}
.tile .nr{font-size:.78rem; color:var(--muted); font-weight:650; letter-spacing:.03em}
.tile h3{font-size:1.14rem; margin:8px 0 6px}
.tile .meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}
.chip{font-size:.72rem; padding:4px 10px; border-radius:99px; font-weight:600}
.chip.pflicht{background:var(--pink); color:var(--maroon)}
.chip.wahl{background:var(--yellow-l); color:var(--yellow)}
.chip.arbeit{background:var(--blue-l); color:var(--blue)}
.tile .doneflag{position:absolute; top:14px; right:14px; font-size:1.1rem; opacity:0; transform:scale(.5); transition:.25s cubic-bezier(.2,.9,.3,1.3)}
.tile.done .doneflag{opacity:1; transform:scale(1)}
.tile.done{border-color:#bfe3c0}
.section-title{font-size:1.5rem; margin:36px 0 4px; font-weight:680}
.section-sub{color:var(--muted); margin:0 0 8px}

/* ---------- Station view ---------- */
.station{display:none; padding:26px 0 90px}
.station.active{display:block; animation:fade .35s ease}
@keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.st-head{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:24px; box-shadow:var(--sh); position:relative; overflow:hidden}
.st-head .bar{position:absolute; inset:0 0 auto 0; height:6px}
.st-head .row1{display:flex; align-items:center; gap:14px}
.st-head .ic{font-size:2.4rem}
.st-head .nr{color:var(--muted); font-weight:650; font-size:.82rem}
.st-head h2{font-size:1.7rem; margin:2px 0}
.st-head .leit{margin:14px 0 0; font-size:1.06rem}
.st-head .leit b{color:var(--maroon)}
.kann{margin:14px 0 0; padding:14px 16px; background:var(--sand); border-radius:var(--r-s)}
.kann b{display:block; margin-bottom:6px; font-size:.9rem}
.kann ul{margin:0; padding-left:20px}
.kann li{margin:3px 0}
.komp{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
.komp .k{font-size:.7rem; background:#efe9e0; color:#7a6a55; border-radius:6px; padding:3px 8px; font-weight:600}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 14px; position:sticky; top:64px; z-index:20; background:linear-gradient(180deg,var(--paper) 70%,transparent); padding:8px 0}
.tab{border:1px solid var(--line); background:var(--card); border-radius:99px; padding:9px 16px; font-size:.92rem; cursor:pointer; transition:transform .12s, background .2s, color .2s; white-space:nowrap}
.tab:active{transform:scale(.96)}
.tab.active{background:var(--maroon); color:#fff; border-color:var(--maroon)}
.panel{display:none}
.panel.active{display:block; animation:fade .3s ease}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--sh); margin-bottom:18px}
.card h3{font-size:1.15rem; margin-bottom:8px}
.instruction{background:var(--blue-l); border-left:5px solid var(--blue); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:.98rem}
.instruction b{color:var(--blue)}

/* ---------- Level switch ---------- */
.levels{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.lvl{border:2px solid transparent; border-radius:99px; padding:8px 16px; font-weight:600; cursor:pointer; font-size:.9rem; transition:transform .12s, background .2s}
.lvl:active{transform:scale(.96)}
.lvl[data-l="basis"]{background:var(--green-l); color:var(--green)}
.lvl[data-l="mittel"]{background:var(--yellow-l); color:var(--yellow)}
.lvl[data-l="erweitert"]{background:var(--blue-l); color:var(--blue)}
.lvl.active[data-l="basis"]{border-color:var(--green)}
.lvl.active[data-l="mittel"]{border-color:var(--yellow)}
.lvl.active[data-l="erweitert"]{border-color:var(--blue)}
.reading-aids{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:8px 0 16px; font-size:.9rem; color:var(--muted)}
.switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none}
.switch input{display:none}
.switch .track{width:42px; height:24px; background:#d7d0c6; border-radius:99px; position:relative; transition:background .2s}
.switch .track::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .22s cubic-bezier(.2,.9,.3,1.3)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(18px)}

.textbody{font-size:1.06rem}
.textbody p{margin:0 0 12px}
.bold-keys .fach{font-weight:800; color:#000}
.show-verbs .vb{border-bottom:2px dotted #b9b2a6}
.fach{border-bottom:1px dashed var(--purple); cursor:help; position:relative; color:inherit}
.fach:hover, .fach:focus{background:#f3ecf7; outline:none}
.fach::after{content:attr(data-def); position:absolute; left:50%; bottom:135%; transform:translateX(-50%) translateY(6px); background:#2b2140; color:#fff; padding:9px 12px; border-radius:10px; width:max-content; max-width:260px; font-size:.82rem; line-height:1.35; font-weight:400; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; box-shadow:var(--sh-h); z-index:30; white-space:normal}
.fach::before{content:""; position:absolute; left:50%; bottom:135%; transform:translateX(-50%) translateY(6px); border:7px solid transparent; border-top-color:#2b2140; opacity:0; transition:opacity .18s, transform .18s; z-index:30}
.fach:hover::after,.fach:focus::after,.fach:hover::before,.fach:focus::before{opacity:1; transform:translateX(-50%) translateY(0)}

.wortspeicher{background:var(--green-l); border-radius:14px; padding:12px 14px; margin:14px 0}
.wortspeicher b{font-size:.85rem; color:var(--green)}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.pill{background:#fff; border:1px solid #bfe0c0; color:#215a24; border-radius:99px; padding:5px 12px; font-size:.86rem; cursor:default}

/* ---------- Task list ---------- */
.task{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:10px 0; background:#fff}
.task .op{display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.03em; padding:2px 8px; border-radius:6px; background:#efe9e0; color:#7a6a55; margin-right:8px; text-transform:uppercase}
.task .afb{background:var(--blue-l); color:var(--blue)}
.heft{display:inline-flex; align-items:center; gap:4px; font-size:.72rem; background:#fff4d6; color:#8a6a12; border:1px solid #f0dca0; border-radius:8px; padding:2px 8px; margin-left:6px; vertical-align:middle}
.reveal-btn{margin-top:10px; border:1px dashed var(--maroon2); background:#fff; color:var(--maroon); border-radius:10px; padding:7px 14px; font-size:.85rem; cursor:pointer; transition:transform .12s}
.reveal-btn:active{transform:scale(.97)}
.muster{margin-top:10px; background:var(--pink); border-left:4px solid var(--maroon2); border-radius:10px; padding:12px 14px; font-size:.95rem; display:none}
.muster.show{display:block; animation:fade .25s ease}
.muster b{color:var(--maroon)}
.tasklist{list-style:none; margin:0; padding:0; counter-reset:aa}
.tasklist li{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; background:#fff}
.tasklist .nr{flex:none; width:30px; height:30px; border-radius:50%; background:var(--maroon); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.95rem}
.tasklist .tx{flex:1}
.tasklist .afb{display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.03em; padding:2px 8px; border-radius:6px; margin-right:8px; vertical-align:1px}
.afb.a1{background:var(--green-l); color:var(--green)} .afb.a2{background:var(--yellow-l); color:var(--yellow)} .afb.a3{background:var(--blue-l); color:var(--blue)}
.heft-hint{font-size:.88rem; color:var(--muted); margin:6px 0 0}
.loesung{margin-top:6px; background:var(--pink); border:1px solid #d5dce8; border-radius:var(--r-s); overflow:hidden}
.loesung>summary{cursor:pointer; list-style:none; padding:13px 16px; font-weight:650; color:var(--maroon); display:flex; align-items:center; gap:8px; user-select:none}
.loesung>summary::-webkit-details-marker{display:none}
.loesung>summary::after{content:"▸"; margin-left:auto; transition:transform .2s var(--ease)}
.loesung[open]>summary::after{transform:rotate(90deg)}
.loesung .l-body{padding:2px 16px 14px; border-top:1px solid #d5dce8; background:#fff}
.loesung ol{margin:10px 0 4px; padding-left:22px}
.loesung li{margin:8px 0}
.loesung .l-note{font-size:.88rem; color:var(--muted); margin:10px 0 0}
.wfragen{margin:6px 0 14px; padding-left:22px}
.wfragen li{margin:6px 0}

/* ---------- Quellenanalyse ---------- */
.qtable{width:100%; border-collapse:collapse; margin-top:6px}
.qtable td{border:1px solid var(--line); padding:10px 12px; vertical-align:top}
.qtable td.q{width:34%; font-weight:600; background:#faf7f2}
.qsrc{background:#f5eef8; border-left:5px solid var(--purple); border-radius:12px; padding:14px 16px; margin:6px 0 16px}
.qsrc p{margin:0 0 10px}
.qsrc .angabe{font-size:.8rem; color:var(--muted)}
.qa-q{margin:12px 0}
.qa-q .qh{font-weight:600; margin-bottom:6px}

/* ---------- Simulation ---------- */
.sim-hint{color:var(--muted); font-size:.92rem; margin-bottom:12px}
.baskets{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px}
.basket{border:2px dashed var(--line); border-radius:14px; padding:12px; min-height:120px; background:#fff}
.basket h4{margin:0 0 8px; font-size:.95rem}
.basket.ok{border-color:var(--green)}
.movable{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0}
.token{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:grab; font-size:.9rem; box-shadow:var(--sh); transition:transform .12s}
.token:active{cursor:grabbing; transform:scale(1.04)}
.token.placed{background:var(--sand)}
.slotline{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.slot{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:#fff}
.slot .num{width:26px; height:26px; border-radius:50%; background:var(--maroon); color:#fff; display:grid; place-items:center; font-size:.8rem; font-weight:700; flex:none}
.slot select{flex:1; border:1px solid var(--line); border-radius:8px; padding:7px; font-family:inherit}
.wf-item{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; background:#fff}
.wf-btns{display:flex; gap:6px; flex:none}
.wf-btns button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:.85rem}
.wf-btns button.sel{background:var(--maroon); color:#fff; border-color:var(--maroon)}
.match-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.check-btn{margin-top:14px; background:var(--maroon); color:#fff; border:none; border-radius:12px; padding:11px 20px; font-size:.95rem; cursor:pointer; transition:transform .12s, filter .2s}
.check-btn:active{transform:scale(.97)}
.check-btn:hover{filter:brightness(1.06)}
.sim-result{margin-top:12px; font-weight:600}
.ok-txt{color:var(--green)} .no-txt{color:#b03a2e}

/* ---------- Quiz ---------- */
.qq{border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:12px 0; background:#fff}
.qq .qtxt{font-weight:650; margin-bottom:10px}
.opt{display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:12px 14px; margin:8px 0; cursor:pointer; font-size:.98rem; transition:transform .1s, border-color .2s, background .2s}
.opt:hover{border-color:var(--maroon2)}
.opt:active{transform:scale(.99)}
.opt.correct{background:var(--green-l); border-color:var(--green)}
.opt.wrong{background:#fbe9e7; border-color:#e0897c}
.opt .fb{display:block; font-size:.85rem; margin-top:6px; color:var(--muted)}
.lw{margin-top:16px; text-align:center; padding:18px; border-radius:16px; background:var(--sand); border:1px dashed #c9bfae}
.lw.locked{opacity:.65}
.lw .word{font-size:1.5rem; font-weight:750; letter-spacing:.08em; color:var(--maroon); filter:blur(7px); transition:filter .5s}
.lw.solved .word{filter:none}
.lw small{display:block; color:var(--muted); margin-top:6px}
.quiz-tools{display:flex; gap:10px; align-items:center; margin-bottom:10px}
.ghost{border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:.85rem}

/* ---------- Glossar / videos ---------- */
.gloss-item{display:flex; gap:12px; align-items:flex-start; border-bottom:1px solid var(--line); padding:12px 0}
.gloss-item input{margin-top:5px; width:18px; height:18px}
.gloss-item .term{font-weight:650}
.gloss-item .src{font-size:.75rem; color:var(--muted)}
.vid{display:flex; gap:14px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; background:#fff}
.vid .play{font-size:1.6rem}
.vid .info{flex:1}
.vid .info b{display:block}
.vid .info small{color:var(--muted)}
.vid a{white-space:nowrap; background:var(--teal); color:#fff; text-decoration:none; padding:9px 14px; border-radius:10px; font-size:.85rem}

/* ---------- Station foot ---------- */
.st-foot{display:flex; gap:12px; align-items:center; justify-content:space-between; margin-top:20px; flex-wrap:wrap}
.mark-done{background:var(--green); color:#fff; border:none; border-radius:12px; padding:12px 22px; font-size:1rem; cursor:pointer; transition:transform .12s, filter .2s}
.mark-done:active{transform:scale(.97)}
.mark-done.is-done{background:#8a8a8a}
.nav-lr{display:flex; gap:10px}
.nav-lr button{border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 18px; cursor:pointer}
.tipbox .reveal-btn{border-style:solid}

/* ---------- Toast ---------- */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(30px); background:#1d1d1f; color:#fff; padding:13px 22px; border-radius:14px; box-shadow:var(--sh-h); opacity:0; pointer-events:none; transition:opacity .3s, transform .3s cubic-bezier(.2,.9,.3,1.3); z-index:100; font-size:.95rem}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- Laufzettel modal ---------- */
.modal{position:fixed; inset:0; background:rgba(20,15,15,.45); backdrop-filter:blur(6px); display:none; z-index:80; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto}
.modal.show{display:flex; animation:fade .25s ease}
.sheet{background:var(--card); border-radius:22px; max-width:760px; width:100%; padding:26px; box-shadow:var(--sh-h)}
.sheet h2{margin-bottom:12px}
.sheet table{width:100%; border-collapse:collapse; font-size:.9rem}

const STATIONS = [];
function addStation(o){ STATIONS.push(o); }
const KOMP_LABEL={SK:"Sachkompetenz",MK:"Methodenkompetenz",UK:"Urteilskompetenz",HK:"Handlungskompetenz"};

/* =====================================================================
   STATE
   ===================================================================== */
const LS="ns2wk_lernreise_v1";
let state={done:{},solved:{},level:{},gloss:{}};
try{ const s=localStorage.getItem(LS); if(s) state=Object.assign(state,JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){} }

/* =====================================================================
   HELFER
   ===================================================================== */
function HEFT(nr){ return '<span class="heft">📓 ins Heft · Aufg. '+nr+'</span>'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const VERBS=["ist","sind","war","waren","wurde","wurden","hat","hatte","hatten","beschloss","verbot","verboten","zerstörten","zerstörte","begann","begannen","führte","führten","ernannte","nutzten","setzte","durfte","durften","stimmte","kämpften","starben","ermordeten","erschossen","überfiel","besetzte","besetzten","kapitulierte","verfolgte","verfolgten","floh","flohen","erinnert","warfen","brannte","brannten","glaubten","riefen","verteilte","versuchten","wehrten","halfen","versteckten","leisteten","gehört","erklärt","zeigt","stieg","stiegen","lernten","sollten","kamen","machten","mussten","arbeiteten","wollten","gewinnen","töten","töteten","plante","planten","gab","raubte"];

function annotate(raw){
  let s=esc(raw);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Verben (dezent) – vor den Fachbegriffen, damit keine Verschachtelung entsteht
  for(const v of VERBS){
    const re=new RegExp('(?![^<]*>)(?<![\\wäöüßÄÖÜ])('+escRe(v)+')(?![\\wäöüßÄÖÜ])');
    s=s.replace(re,'<span class="vb">$1</span>');
  }
  // Fachbegriffe (längste zuerst), jeweils erstes Vorkommen
  const terms=Object.keys(TERM_DEFS).sort((a,b)=>b.length-a.length);
  for(const t of terms){
    const re=new RegExp('(?![^<]*>)(?<![\\wäöüßÄÖÜ-])('+escRe(t)+')(?![\\wäöüßÄÖÜ])');
    if(re.test(s)) s=s.replace(re,'<span class="fach" tabindex="0" data-def="'+escAttr(TERM_DEFS[t])+'">$1</span>');
  }
  return s;
}
function paras(arr){ return arr.map(p=>'<p>'+annotate(p)+'</p>').join(''); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function updateProgress(){
  const total=STATIONS.filter(s=>s.status!=='arbeit'||s.id!=='glossar').length;
  const done=STATIONS.filter(s=>state.done[s.id]).length;
  const pct=total?Math.round(done/STATIONS.length*100):0;
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('ptext').textContent=pct+' %';
}

/* =====================================================================
   HOME / LERNLANDKARTE
   ===================================================================== */
function goHome(){
  document.getElementById('stationView').classList.remove('active');
  document.getElementById('home').style.display='block';
  window.scrollTo({top:0});
}
function renderHome(){
  const h=document.getElementById('home');
  const tiles=STATIONS.map(s=>{
    const done=state.done[s.id]?'done':'';
    return `<button class="tile ${done}" style="--c:${s.color}" onclick="openStation('${s.id}')">
      <div class="accent" style="background:${s.color}"></div>
      <div class="doneflag">✅</div>
      <div class="ic">${s.ic}</div>
      <div class="nr">STATION ${s.nr}</div>
      <h3>${esc(s.title)}</h3>
      <div class="meta">
        <span class="chip ${s.status}">${s.status==='pflicht'?'Pflicht':s.status==='wahl'?'Wahl':'Arbeit'}</span>
        <span style="font-size:.75rem;color:var(--muted)">${esc(s.buch)}</span>
      </div>
    </button>`;
  }).join('');
  const nSt=STATIONS.filter(s=>s.id!=='glossar').length;
  h.innerHTML=`
    <div class="hero">
      <div class="kicker">Geschichte · Klasse 10 · Realschule</div>
      <h1>Nationalsozialismus</h1>
      <p class="lead">Eine Lernreise in ${nSt} Stationen und einem Glossar. Leitfrage: <b>Wie wurde aus einer Demokratie eine Diktatur – und wie erinnern wir uns heute daran?</b></p>
      <div class="legend">
        <span class="tag"><b>🟢 Stufe 1</b> leicht</span>
        <span class="tag"><b>🟡 Stufe 2</b> mittel</span>
        <span class="tag"><b>🔵 Stufe 3</b> anspruchsvoll (AFB I→II→III)</span>
      </div>
    </div>
    ${einstufungButton()}
    <h2 class="section-title">Lernlandkarte</h2>
    <p class="section-sub">Wähle eine Station. Bei jeder Station kannst du deine Stufe selbst einstellen. Dein Fortschritt wird automatisch gespeichert.</p>
    <div class="grid">${tiles}</div>`;
  updateProgress();
}

/* =====================================================================
   STATION
   ===================================================================== */
let cur=null;
function openStation(id){
  cur=STATIONS.find(s=>s.id===id); if(!cur) return;
  if(!state.level[id]) state.level[id]=state.recommendedLevel||'mittel';
  document.getElementById('home').style.display='none';
  const v=document.getElementById('stationView'); v.classList.add('active');
  const tabs=[['text','📖 Text & Auftrag']];
  if(cur.quelle) tabs.push(['quelle','🔎 Quellenanalyse']);
  if(cur.sim) tabs.push(['sim','🧩 '+(cur.simTitle||'Übung')]);
  if(cur.quiz) tabs.push(['quiz','❓ Quiz']);
  tabs.push(['glossar','📚 Glossar']);
  if(cur.medien&&cur.medien.length) tabs.push(['zusatz','🎬 Zusatz']);
  v.innerHTML=`
    <div class="st-head"><div class="bar" style="background:${cur.color}"></div>
      <div class="row1"><div class="ic">${cur.ic}</div>
        <div><div class="nr">STATION ${cur.nr} · ${esc(cur.buch)}</div><h2>${esc(cur.title)}</h2></div></div>
      <p class="leit">🧭 <b>Leitfrage:</b> ${esc(cur.leit)}</p>
      <div class="kann"><b>Das kann ich am Ende:</b><ul>${cur.kann.map(k=>'<li>'+esc(k)+'</li>').join('')}</ul></div>
      <div class="komp">${(cur.komp||[]).map(k=>'<span class="k" title="'+KOMP_LABEL[k]+'">'+k+'</span>').join('')}</div>
    </div>
    <div class="tabs">${tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t[0]}" onclick="switchTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
    <div id="panels"></div>
    <div class="st-foot">
      <button class="mark-done ${state.done[cur.id]?'is-done':''}" id="markBtn" onclick="toggleDone()">${state.done[cur.id]?'✓ erledigt (klicken zum Zurücksetzen)':'Station als erledigt markieren'}</button>
      <div class="nav-lr">${prevNextBtns()}</div>
    </div>`;
  const p=document.getElementById('panels');
  p.innerHTML=tabs.map((t,i)=>`<div class="panel ${i===0?'active':''}" id="p-${t[0]}">${renderPanel(t[0])}</div>`).join('');
  afterPanelRender();
  window.scrollTo({top:0});
}
function prevNextBtns(){
  const i=STATIONS.indexOf(cur); let out='';
  if(i>0) out+=`<button onclick="openStation('${STATIONS[i-1].id}')">← ${esc(STATIONS[i-1].title.slice(0,18))}…</button>`;
  if(i<STATIONS.length-1) out+=`<button onclick="openStation('${STATIONS[i+1].id}')">${esc(STATIONS[i+1].title.slice(0,18))}… →</button>`;
  return out;
}
function switchTab(id){
  document.querySelectorAll('#stationView .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('#panels .panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+id));
  if(id==='quiz') renderQuiz();
}
function toggleDone(){
  state.done[cur.id]=!state.done[cur.id]; save();
  document.getElementById('markBtn').classList.toggle('is-done',state.done[cur.id]);
  document.getElementById('markBtn').textContent=state.done[cur.id]?'✓ erledigt (klicken zum Zurücksetzen)':'Station als erledigt markieren';
  if(state.done[cur.id]) toast('Station als erledigt markiert 🎉');
  updateProgress();
}

/* ---------- Panels ---------- */
function renderPanel(id){
  if(id==='text') return renderText();
  if(id==='quelle') return renderQuelle();
  if(id==='sim') return `<div class="card"><h3>🧩 ${esc(cur.simTitle||'Übung')}</h3><div id="simHost"></div></div>`;
  if(id==='quiz') return `<div class="card" id="quizHost"></div>`;
  if(id==='glossar') return renderGlossar();
  if(id==='zusatz') return renderZusatz();
  return '';
}
function afterPanelRender(){
  setLevel(state.level[cur.id]||'mittel', true);
  if(cur.sim) renderSim();
}

/* ---------- TEXT & Auftrag ---------- */
function renderText(){
  return `
  <div class="instruction">📌 <b>So arbeitest du:</b> ${esc(cur.leseanleitung||'Lies zuerst die Arbeitsaufträge. Lies dann den Text aufmerksam und tippe die unterstrichenen Fachbegriffe für die Erklärung an.')}</div>
  <div class="card">
    <div class="levels">
      <button class="lvl" data-l="basis" onclick="setLevel('basis')">🟢 Stufe 1 · leicht</button>
      <button class="lvl" data-l="mittel" onclick="setLevel('mittel')">🟡 Stufe 2 · mittel</button>
      <button class="lvl" data-l="erweitert" onclick="setLevel('erweitert')">🔵 Stufe 3 · anspruchsvoll</button>
    </div>
    <div id="auftragHost"></div>
    <div id="wsHost"></div>
  </div>
  <div class="card">
    <h3>📖 Text</h3>
    <div class="reading-aids">
      <label class="switch"><input type="checkbox" id="boldKeys" onchange="document.getElementById('textbody').classList.toggle('bold-keys',this.checked)"><span class="track"></span> Lesehilfe: Schlüsselwörter fett</label>
      <label class="switch"><input type="checkbox" id="showVerbs" onchange="document.getElementById('textbody').classList.toggle('show-verbs',this.checked)"><span class="track"></span> Verben zeigen</label>
    </div>
    <div class="textbody" id="textbody"></div>
  </div>
  <div class="card" id="loesungHost"></div>`;
}
function setLevel(l, silent){
  if(!cur) return;
  state.level[cur.id]=l; if(!silent) save();
  document.querySelectorAll('#p-text .lvl').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  const tb=document.getElementById('textbody'); if(!tb) return;
  const key=l==='basis'?'n1':l==='mittel'?'n2':'n3';
  tb.innerHTML=paras(cur.texte[key]);
  // Wortspeicher nur Stufe 1
  const ws=document.getElementById('wsHost');
  if(l==='basis'&&cur.wortspeicher){
    ws.innerHTML=`<div class="wortspeicher"><b>🗝️ Wortspeicher – nutze diese Wörter:</b><div class="pills">${cur.wortspeicher.map(w=>'<span class="pill">'+esc(w)+'</span>').join('')}</div></div>`;
  } else ws.innerHTML='';
  renderAuftrag(l);
}
const AFB_ROM={1:'I',2:'II',3:'III'};
function afbBadge(n){ return `<span class="afb a${n}">AFB ${AFB_ROM[n]}</span>`; }
function taskList(tasks,txtKey){
  return `<ol class="tasklist">${tasks.map((t,i)=>`<li><span class="nr">${i+1}</span><div class="tx">${afbBadge(t.afb)}${annotate(t[txtKey])}</div></li>`).join('')}</ol>`;
}
function loesungBox(title,items,note){
  return `<details class="loesung"><summary>💡 ${title}</summary><div class="l-body">
    <ol>${items.map(m=>'<li>'+m+'</li>').join('')}</ol>${note?'<p class="l-note">'+note+'</p>':''}</div></details>`;
}
function renderAuftrag(l){
  const host=document.getElementById('auftragHost'); if(!host) return;
  const tasks=cur.levels[l]||[];
  const lab=l==='basis'?'🟢 Stufe 1':l==='mittel'?'🟡 Stufe 2':'🔵 Stufe 3';
  host.innerHTML=`<h3 style="margin-top:14px">✍️ Arbeitsaufträge – ${lab}</h3>
    ${taskList(tasks,'txt')}
    <p class="heft-hint">📓 Lies zuerst die Aufträge, dann den Text. Bearbeite die Aufträge in deinem Heft.</p>`;
  const lh=document.getElementById('loesungHost');
  if(lh) lh.innerHTML=`<h3>✅ Lösungen – ${lab}</h3>
    <p style="margin:0 0 10px;color:var(--muted);font-size:.92rem">Erst selbst bearbeiten, dann vergleichen. Übertrage das gesicherte Ergebnis sauber in deine Mappe.</p>
    ${loesungBox('Musterlösungen anzeigen',tasks.map(t=>annotate(t.muster)))}`;
}

/* ---------- QUELLENANALYSE ---------- */
const WFRAGEN=[['wer','Wer schreibt den Text?'],['wann','Wann wurde der Text geschrieben?'],['wo','Wo passierten die Ereignisse?'],['fuerwen','Wer sollte/soll diesen Text lesen?'],['warum','Warum schreibt der Autor über die Ereignisse?'],['art','Um welche Quellenart handelt es sich? (Gattung + Nähe zum Ereignis)']];
function renderQuelle(){
  const q=cur.quelle;
  const wAnt=WFRAGEN.map(f=>'<b>'+esc(f[1])+'</b><br>'+esc(f[0]==='art'?q.art:(q.felder[f[0]]||'—')));
  return `

let quizState={};
function renderQuiz(){
  const host=document.getElementById('quizHost'); if(!host||!cur.quiz) return;
  quizState={answered:{},correct:{}};
  const fragen=cur.quiz.fragen;
  const body=fragen.map((f,qi)=>{
    const opts=shuffle(f.opt);
    return `<div class="qq" id="qq-${qi}"><div class="qtxt">${qi+1}. ${esc(f.frage)}</div>
      ${opts.map(o=>`<button class="opt" onclick="answer(${qi},this,${o.c?1:0},'${escAttr(o.fb||'')}')">${esc(o.t)}<span class="fb"></span></button>`).join('')}</div>`;
  }).join('');
  const solved=state.solved[cur.id];
  host.innerHTML=`<div class="instruction">❓ Beantworte alle Fragen. Bei jedem Aufruf werden die Antworten neu gemischt. Erst wenn <b>alles richtig</b> ist, erscheint das Lösungswort für den Laufzettel.</div>
    <div class="quiz-tools"><button class="ghost" onclick="renderQuiz()">🔀 Neu mischen</button><small style="color:var(--muted)">${fragen.length} Fragen</small></div>
    ${body}
    <div class="lw ${solved?'solved':'locked'}" id="lwbox"><div>🔑 Lösungswort</div><div class="word">${esc(cur.quiz.lw)}</div><small>${solved?'Freigeschaltet – ab in den Laufzettel!':'Noch gesperrt: beantworte alle Fragen richtig.'}</small></div>`;
}
function answer(qi,btn,correct,fb){
  const box=document.getElementById('qq-'+qi);
  box.querySelectorAll('.opt').forEach(b=>{b.disabled=false;});
  // reset styles in this question
  box.querySelectorAll('.opt').forEach(b=>{b.classList.remove('correct','wrong'); b.querySelector('.fb').textContent='';});
  btn.classList.add(correct?'correct':'wrong');
  btn.querySelector('.fb').textContent=(correct?'✅ ':'❌ ')+fb;
  quizState.answered[qi]=true; quizState.correct[qi]=!!correct;
  const total=cur.quiz.fragen.length;
  const allCorrect=Object.keys(quizState.correct).length===total && Object.values(quizState.correct).every(Boolean);
  if(allCorrect){
    state.solved[cur.id]=true; save();
    const lw=document.getElementById('lwbox'); lw.classList.remove('locked'); lw.classList.add('solved');
    lw.querySelector('small').textContent='Freigeschaltet – ab in den Laufzettel!';
    toast('Alles richtig! Lösungswort freigeschaltet 🔑');
  }
}

function renderSim(){
  const host=document.getElementById('simHost'); if(!host||!cur.sim) return;
  const s=cur.sim;
  host.innerHTML='<p class="sim-hint">'+esc(s.hint||'')+'</p><div id="simBody"></div><button class="check-btn" onclick="checkSim()">Prüfen</button><div class="sim-result" id="simRes"></div>';
  const b=document.getElementById('simBody');
  if(s.type==='sortier') simSortier(b,s);
  else if(s.type==='ordnen') simOrdnen(b,s);
  else if(s.type==='stufen') simStufen(b,s);
  else if(s.type==='wahrfalsch') simWF(b,s);
  else if(s.type==='zuordnen') simZuordnen(b,s);
  else if(s.type==='glossaralle') { b.innerHTML=glossarAlleHTML(); host.querySelector('.check-btn').style.display='none'; }
}
function simSortier(b,s){
  b.innerHTML=`<div class="movable" id="pool">${s.items.map((it,i)=>`<span class="token" draggable="true" data-i="${i}" ondragstart="dragTok(event)">${esc(it.t)}</span>`).join('')}</div>
    <div class="baskets">
      <div class="basket" data-b="0" ondragover="event.preventDefault()" ondrop="dropTok(event,0)"><h4>${esc(s.b0)}</h4></div>
      <div class="basket" data-b="1" ondragover="event.preventDefault()" ondrop="dropTok(event,1)"><h4>${esc(s.b1)}</h4></div>
    </div>`;
}
let dragI=null;
function dragTok(e){ dragI=e.target.dataset.i; e.dataTransfer.setData('text',dragI); }
function dropTok(e,basket){ e.preventDefault(); const i=e.dataTransfer.getData('text'); const tok=document.querySelector('#simBody .token[data-i="'+i+'"]'); if(tok){ tok.classList.add('placed'); tok.dataset.b=basket; e.currentTarget.appendChild(tok);} }
function simOrdnen(b,s){
  const sh=shuffle(s.items.map((t,i)=>({t,i})));
  b.innerHTML=`<div class="slotline">${s.items.map((_,pos)=>`<div class="slot"><div class="num">${pos+1}</div>
    <select data-pos="${pos}">${['<option value="">– wählen –</option>'].concat(sh.map(o=>'<option value="'+o.i+'">'+esc(o.t)+'</option>')).join('')}</select></div>`).join('')}</div>`;
}
function simStufen(b,s){
  b.innerHTML=`<div class="slotline">${s.items.map((it,i)=>`<div class="slot"><div class="num">${i+1}</div><span style="flex:1">${esc(it.t)}</span>
    <select data-i="${i}"><option value="">– Stufe wählen –</option>${s.stufen.map((st,si)=>'<option value="'+si+'">'+esc(st)+'</option>').join('')}</select></div>`).join('')}</div>`;
}
function simWF(b,s){
  b.innerHTML=s.items.map((it,i)=>`<div class="wf-item"><span>${annotate(it.t)}</span>
    <div class="wf-btns"><button data-i="${i}" data-v="1" onclick="wfSel(this)">wahr</button><button data-i="${i}" data-v="0" onclick="wfSel(this)">falsch</button></div></div>`).join('');
}
function wfSel(btn){ btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); btn.classList.add('sel'); }
function simZuordnen(b,s){
  const defs=shuffle(s.pairs.map((p,i)=>({d:p.d,i})));
  b.innerHTML=`<div class="match-grid">${s.pairs.map((p,i)=>`<div class="slot"><span style="flex:1"><b>${esc(p.t)}</b></span>
    <select data-i="${i}"><option value="">– Erklärung –</option>${defs.map(o=>'<option value="'+o.i+'">'+esc(o.d)+'</option>').join('')}</select></div>`).join('')}</div>`;
}
function checkSim(){
  const s=cur.sim, res=document.getElementById('simRes'); let ok=false,msg='';
  if(s.type==='sortier'){
    let right=0,tot=s.items.length,placed=0;
    document.querySelectorAll('#simBody .token').forEach(t=>{ if(t.dataset.b!==undefined){placed++; if(+t.dataset.b===s.items[+t.dataset.i].b) right++;} });
    ok=right===tot&&placed===tot; msg=ok?'✅ Alles richtig einsortiert!':`Noch nicht ganz: ${right} von ${tot} richtig${placed<tot?' (nicht alle eingeordnet)':''}.`;
  } else if(s.type==='ordnen'){
    const sel=[...document.querySelectorAll('#simBody select')]; let right=0;
    sel.forEach((se,pos)=>{ if(se.value!==''&&+se.value===pos) right++; });
    ok=right===s.items.length; msg=ok?'✅ Reihenfolge korrekt!':`${right} von ${s.items.length} an der richtigen Stelle.`;
  } else if(s.type==='stufen'){
    const sel=[...document.querySelectorAll('#simBody select')]; let right=0;
    sel.forEach(se=>{ const i=+se.dataset.i; if(se.value!==''&&+se.value===s.items[i].s) right++; });
    ok=right===s.items.length; msg=ok?'✅ Alle richtig zugeordnet!':`${right} von ${s.items.length} richtig.`;
  } else if(s.type==='wahrfalsch'){
    let right=0; s.items.forEach((it,i)=>{ const sel=document.querySelector('#simBody button.sel[data-i="'+i+'"]'); if(sel&&+sel.dataset.v===(it.w?1:0)) right++; });
    ok=right===s.items.length; msg=ok?'✅ Alles richtig beurteilt!':`${right} von ${s.items.length} richtig.`;
  } else if(s.type==='zuordnen'){
    const sel=[...document.querySelectorAll('#simBody select')]; let right=0;
    sel.forEach(se=>{ const i=+se.dataset.i; if(se.value!==''&&+se.value===i) right++; });
    ok=right===s.pairs.length; msg=ok?'✅ Alle Paare stimmen!':`${right} von ${s.pairs.length} richtig zugeordnet.`;
  }
  res.innerHTML='<span class="'+(ok?'ok-txt':'no-txt')+'">'+msg+'</span>';
  if(ok) toast('Übung gelöst 👍');
}

let estAnswers={};
function einstufungButton(){

    <span><h3>Einstufungstest – finde deine Stufe</h3>

    ${label?`<span class="done-badge">✓ Empfehlung: ${label}</span>`:`<span class="go">Los geht’s →</span>`}
  </button>`;

function openEinstufung(){
  estAnswers={};
  document.getElementById('home').style.display='none';
  const v=document.getElementById('stationView'); v.classList.add('active');
  v.innerHTML=`<div class="est-wrap">
    <div class="st-head"><div class="bar" style="background:var(--brand)"></div>
      <div class="row1"><div class="ic">🎯</div><div><div class="nr">STATION 0</div><h2>Einstufungstest</h2></div></div>
      <p class="leit">Kreuze ehrlich an, was am besten zu dir passt. Es gibt kein „richtig“ oder „falsch“ – der Bogen hilft dir nur, die passende Stufe zu finden. Du kannst die Stufe an jeder Station später selbst ändern.</p>
    </div>
    <div id="estQs">${EINSTUFUNG.map((q,i)=>`<div class="est-q"><div class="qh">${i+1}. ${esc(q.f)}</div>
      <div class="est-opts">${q.o.map((o,k)=>`<button class="est-opt" data-q="${i}" data-p="${o[1]}" onclick="estPick(${i},${o[1]},this)">${esc(o[0])}</button>`).join('')}</div></div>`).join('')}</div>
    <button class="check-btn" style="background:var(--brand)" onclick="estAuswerten()">Auswerten &amp; Empfehlung anzeigen</button>
    <div class="est-result" id="estResult"></div>
  </div>`;
  window.scrollTo({top:0});
}
function estPick(i,p,btn){
  estAnswers[i]=p;
  [...btn.parentElement.children].forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function estAuswerten(){
  const keys=Object.keys(estAnswers);
  if(keys.length<EINSTUFUNG.length){ toast('Bitte beantworte zuerst alle Fragen.'); return; }
  let sum=0; keys.forEach(k=>sum+=estAnswers[k]);
  const avg=sum/EINSTUFUNG.length;
  let lvl,badge,txt;
  if(avg<1.7){ lvl='basis'; badge='b1'; txt='🟢 Stufe 1 (leicht)'; }
  else if(avg<2.4){ lvl='mittel'; badge='b2'; txt='🟡 Stufe 2 (mittel)'; }
  else { lvl='erweitert'; badge='b3'; txt='🔵 Stufe 3 (anspruchsvoll)'; }
  const tips={basis:'Du startest mit kurzen Texten, Wortspeicher und klaren Schritten. Trau dich, zwischendurch auch Stufe 2 zu testen!',
    mittel:'Du arbeitest auf Schulbuch-Niveau. Wenn dir etwas leichtfällt, probiere ruhig Stufe 3.',
    erweitert:'Du begründest, vergleichst und beurteilst. Nutze die Musterlösungen zum Vergleichen.'};
  const r=document.getElementById('estResult');
  r.className='est-result show';
  r.innerHTML=`<p style="margin:0 0 4px;color:var(--muted)">Deine Empfehlung</p>
    <div class="badge ${badge}">${txt}</div>
    <p>${tips[lvl]}</p>
    <button class="mark-done" style="background:var(--brand)" onclick="applyRecommendation('${lvl}')">Empfehlung übernehmen &amp; starten</button>
    <p style="margin-top:12px;font-size:.85rem;color:var(--muted)">Du bleibst frei: An jeder Station kannst du die Stufe jederzeit umschalten.</p>`;
  if(r.scrollIntoView) r.scrollIntoView({behavior:'smooth',block:'center'});
}
function applyRecommendation(lvl){
  state.recommendedLevel=lvl;
  STATIONS.forEach(s=>{ if(!state.done[s.id]) state.level[s.id]=lvl; });
  save();
  toast('Empfehlung übernommen: '+({basis:'Stufe 1',mittel:'Stufe 2',erweitert:'Stufe 3'})[lvl]);
  goHome();
}

   {afb:1,txt:"**Beschreibe** in zwei Sätzen, was die Regierung durch das Ermächtigungsgesetz tun durfte. Nutze den Wortspeicher.",muster:"Durch das Ermächtigungsgesetz durfte die Regierung Gesetze allein machen. Der Reichstag wurde dafür nicht mehr gebraucht."},

   {afb:2,txt:"**Erkläre**, warum das Ermächtigungsgesetz das Ende der Demokratie bedeutete.",muster:"Die Regierung durfte nun Gesetze ohne das Parlament und sogar gegen die Verfassung erlassen. Damit war die Gewaltenteilung aufgehoben: Der Reichstag konnte die Regierung nicht mehr kontrollieren."},
   {afb:2,txt:"**Erkläre** am Beispiel der Reichstagsbrandverordnung, wie „Recht“ und Gewalt zusammenwirkten.",muster:"Die Verordnung setzte die Grundrechte außer Kraft und lieferte so eine scheinbar „legale“ Grundlage. SA, SS und Polizei nutzten sie, um Gegner ohne Gericht zu verhaften. Das „Recht“ machte die Gewalt möglich."}],
  erweitert:[

   {afb:2,txt:"**Erkläre**, warum das Ermächtigungsgesetz das Ende der Demokratie bedeutete.",muster:"Das Parlament entmachtete sich selbst: Die Regierung durfte Gesetze auch abweichend von der Verfassung erlassen. Die Gewaltenteilung war damit beseitigt, eine Kontrolle der Regierung gab es nicht mehr."},
   {afb:3,txt:"**Beurteile** die Aussage: „Die Nationalsozialisten kamen 1933 legal an die Macht.“ Berücksichtige dabei das Zusammenspiel von Pseudolegalität und Terror.",muster:"Die Aussage trifft nur zum Teil zu. Formal nutzte das Regime Gesetze und Notverordnungen (Art. 48). Diese „Legalität“ war aber nur Schein: Grundrechte waren aufgehoben, Gegner verhaftet, SA und SS schüchterten ein. Ein begründetes Urteil: Die Machtsicherung war pseudolegal – sie wirkte rechtmäßig, war aber erzwungen."}]},

 quelle:{
  titel:"Ermächtigungsgesetz, 24. März 1933",
  einleitung:"Der rechtliche Kern der Diktatur. Lies die Artikel genau.",
  text:["Artikel 1. Reichsgesetze können außer in dem in der Reichsverfassung vorgesehenen Verfahren auch durch die Reichsregierung beschlossen werden. […]",
   "Artikel 2. Die von der Reichsregierung beschlossenen Reichsgesetze können von der Reichsverfassung abweichen, soweit sie nicht die Einrichtung des Reichstags und des Reichsrats als solche zum Gegenstand haben. Die Rechte des Reichspräsidenten bleiben unberührt.",
   "Artikel 5. Dieses Gesetz tritt mit dem Tage seiner Verkündung in Kraft. Es tritt ferner außer Kraft, wenn die gegenwärtige Reichsregierung durch eine andere abgelöst wird."],
  angabe:"Gesetz zur Behebung der Not von Volk und Reich, 24.3.1933 (Auszug). RGBl. 1933 I, S. 141.",
  art:"Textquelle · Primärquelle (der Gesetzestext stammt direkt aus der Zeit der Ereignisse).",
  felder:{wer:"Der Reichstag / die NS-geführte Reichsregierung (amtlicher Gesetzestext).",wann:"24. März 1933.",wo:"Im Deutschen Reich (Reichstag, Berlin).",fuerwen:"Für alle staatlichen Stellen und die Bevölkerung – rechtlich verbindlich.",warum:"Um der Regierung die Gesetzgebung zu übertragen und die Diktatur „legal“ abzusichern."},
  auftraege:[
   {afb:1,q:"**Fasse** den Inhalt der Artikel 1, 2 und 5 in eigenen Worten **zusammen**.",muster:"Die Reichsregierung darf Gesetze selbst beschließen, ohne den Reichstag. Diese Gesetze dürfen sogar von der Verfassung abweichen; nur Reichstag, Reichsrat und die Rechte des Reichspräsidenten bleiben formal bestehen. Das Gesetz gilt sofort und nur für die gegenwärtige Regierung."},
   {afb:2,q:"**Erläutere**, warum das Gesetz die Gewaltenteilung aufhebt.",muster:"Normalerweise beschließt das Parlament die Gesetze (Legislative), die Regierung führt sie aus (Exekutive). Nach Artikel 1 und 2 macht die Regierung die Gesetze nun selbst – auch gegen die Verfassung. Damit liegen beide Gewalten in einer Hand, der Reichstag kann die Regierung nicht mehr kontrollieren."},
   {afb:3,q:"**Beurteile**, ob man das Ermächtigungsgesetz als „legal“ bezeichnen kann.",muster:"Formal wurde es vom Reichstag mit Zweidrittelmehrheit beschlossen. Doch die Abstimmung war nicht frei: Die Grundrechte waren aufgehoben, KPD-Abgeordnete verhaftet oder geflohen, SA und SS standen im Saal. Das Gesetz war daher nur scheinbar legal (pseudolegal) – es diente dazu, die Diktatur mit einem Schein von Recht abzusichern."}]},

addStation({
 id:"a2", nr:"2", ic:"📣", color:"#7a5a86", status:"pflicht",

 buch:"KONTEXT S.2 · Sportpalastrede",
 komp:["SK","MK","UK"],
 leit:"Wie brachte das Regime so viele Menschen dazu, mitzumachen?",
 kann:["Ich kann Propagandamittel an Beispielen beschreiben.","Ich kann die Formel „Volksgemeinschaft“ erklären.","Ich kann eine Propagandarede analysieren."],
 begriffe:["Propaganda","Antisemitismus","Rassismus","Volksgemeinschaft","Führerprinzip","Führerkult","Hitler-Mythos","Volksempfänger","Reichskulturkammer"],
 texte:{
  n1:["Die **Nationalsozialisten** **hatten** ein festes **Weltbild**. Im **Mittelpunkt** **standen** **Rassismus** und **Antisemitismus**. Sie **teilten** die **Menschen** in „bessere\" und „schlechtere Rassen\" ein. Das war falsch und **gefährlich**.", "Ihr **Ziel** war die „**Volksgemeinschaft**\". Manche **gehörten** dazu – andere **schlossen** sie **aus**. Nach dem **Führerprinzip** **galt**: **befehlen** und **gehorchen**. Viele **verehrten** **Hitler** wie einen **Retter** (**Führerkult**).", "**Joseph Goebbels** **leitete** die **Propaganda**. Er **steuerte** **Zeitung**, **Radio** und **Film**. Die **Botschaften** waren **einfach** und **wiederholten** sich oft. Ein billiges **Radio**, der **Volksempfänger**, **brachte** sie in viele **Haushalte**. Große **Aufmärsche** **machten** **Politik** zum **Erlebnis**."],
  n2:["Die NS-Herrschaft stützte sich auf ein geschlossenes Weltbild und auf Propaganda. Im Zentrum standen Rassismus und Antisemitismus: Die Nationalsozialisten teilten die Menschen in angeblich „höher-\" und „minderwertige Rassen\" ein.", "Das Ziel war eine „Volksgemeinschaft\", die nach „Rasse\" bestimmt war. Sie schloss „Volksgenossen\" ein und „Gemeinschaftsfremde\" aus. Nach dem Führerprinzip galten Befehl und Gehorsam; Hitler wurde als „Retter\" verehrt (Führerkult).", "Für die Verbreitung sorgte das Propagandaministerium unter Joseph Goebbels. Es steuerte Presse, Rundfunk und Film. Wichtige Techniken waren einfache, ständig wiederholte Botschaften, starke Gefühle und klare Feindbilder. Der billige „Volksempfänger\" brachte die Botschaften in viele Haushalte, Massenaufmärsche wie die Reichsparteitage machten Politik zum Erlebnis. Am besten wirkte die Propaganda dort, wo sie an vorhandene Meinungen anknüpfte."],
  n3:["Das nationalsozialistische Weltbild war geschlossen, aber in sich widersprüchlich. Rassismus und ein als „Erlösungsantisemitismus\" (Saul Friedländer) radikalisierter Judenhass bildeten sein Zentrum.", "Die „Volksgemeinschaft\" fungierte zugleich als Integrations- und Ausgrenzungsformel: Sie versprach klassenübergreifende Zugehörigkeit für „Volksgenossen\" und definierte „Gemeinschaftsfremde\" heraus. Das Führerprinzip organisierte Herrschaft als Hierarchie von Befehl und Gehorsam.", "Das Propagandaministerium unter Goebbels und die Reichskulturkammer steuerten die gleichgeschalteten Medien. Ian Kershaw fasst die inszenierte Verehrung Hitlers als „Hitler-Mythos\", der Zustimmung erzeugte, ohne dass alle die Ideologie teilten. Die neuere Forschung betont, dass Propaganda selten allmächtig war: Sie verstärkte vorhandene Einstellungen und wirkte besonders bei außenpolitischen „Erfolgen\". Die Ästhetisierung der Politik – Massenaufmärsche, Filme wie „Triumph des Willens\" – verband Emotion und Herrschaft."]},
 wortspeicher:["Propaganda","Volksgemeinschaft","Führerkult","Volksempfänger","Feindbild"],
 levels:{

   {afb:1,txt:"**Beschreibe**, wer zur „Volksgemeinschaft“ gehören sollte und wer nicht. Nutze den Wortspeicher.",muster:"Zur „Volksgemeinschaft“ sollten nur Menschen gehören, die die Nationalsozialisten als „Deutsche“ ansahen. Andere, zum Beispiel Juden, wurden ausgeschlossen."},

  mittel:[
   {afb:1,txt:"**Nenne** drei Mittel, mit denen die NS-Propaganda die Menschen erreichte.",muster:"Zum Beispiel Rundfunk (Volksempfänger), Presse, Film und Massenaufmärsche wie die Reichsparteitage."},
   {afb:2,txt:"**Erkläre**, warum die „Volksgemeinschaft“ zugleich einschloss und ausschloss.",muster:"„Volksgenossen“ sollten sich zugehörig und aufgewertet fühlen. Gleichzeitig wurden „Gemeinschaftsfremde“ wie Juden bewusst ausgeschlossen. Das Gemeinschaftsgefühl entstand gerade durch die Abgrenzung von anderen."},
   {afb:2,txt:"**Erkläre**, warum die Propaganda so viele Menschen beeinflussen konnte.",muster:"Sie nutzte einfache, ständig wiederholte Botschaften, starke Gefühle und klare Feindbilder. Durch den billigen Volksempfänger erreichte sie fast jeden Haushalt. Am besten wirkte sie, wo sie an vorhandene Meinungen anknüpfte."}],
  erweitert:[
   {afb:1,txt:"**Nenne** drei Mittel, mit denen die NS-Propaganda die Menschen erreichte.",muster:"Zum Beispiel gleichgeschaltete Presse, Rundfunk (Volksempfänger), Film („Triumph des Willens“), Massenaufmärsche."},
   {afb:2,txt:"**Erkläre**, warum die „Volksgemeinschaft“ zugleich eine Integrations- und eine Ausgrenzungsformel war.",muster:"Sie versprach allen „Volksgenossen“ Zugehörigkeit über Klassengrenzen hinweg. Zugleich definierte sie „Gemeinschaftsfremde“ heraus und schloss sie aus. Einschluss und Ausschluss bedingen sich gegenseitig."},
   {afb:3,txt:"**Beurteile** die These: „Die Propaganda hat die Menschen völlig umerzogen.“",muster:"Die These ist zu einfach. Propaganda war nicht allmächtig: Sie verstärkte vor allem vorhandene Einstellungen und wirkte besonders bei außenpolitischen „Erfolgen“ (Kershaw: „Hitler-Mythos“). Viele stimmten zu, ohne die ganze Ideologie zu teilen. Propaganda erzeugte also Zustimmung mit – sie erzwang sie nicht allein."}]},

 quelle:{
  titel:"Goebbels, Sportpalastrede „Wollt ihr den totalen Krieg?“, 18.2.1943",
  einleitung:"Kurz nach der Niederlage von Stalingrad. Musterbeispiel der NS-Propaganda – kritisch zu lesen.",
  text:["Ich frage euch: Glaubt ihr mit dem Führer und mit uns an den endgültigen totalen Sieg des deutschen Volkes? […]",
   "Ich frage euch: Wollt ihr den totalen Krieg? Wollt ihr ihn, wenn nötig, totaler und radikaler, als wir ihn uns heute überhaupt noch vorstellen können?",
   "Ich frage euch: Seid ihr bereit, wenn der Führer es befiehlt, zehn, zwölf und, wenn nötig, vierzehn und sechzehn Stunden täglich zu arbeiten und das Letzte herzugeben für den Sieg? […] Nun, Volk, steh auf, und Sturm, brich los!"],
  angabe:"Joseph Goebbels, Rede im Berliner Sportpalast, 18.2.1943 (Auszüge).",
  art:"Textquelle (Rede) · Primärquelle (aus der Zeit selbst).",
  felder:{wer:"Joseph Goebbels, NS-Propagandaminister.",wann:"18. Februar 1943 (nach Stalingrad).",wo:"Berliner Sportpalast, vor ausgewähltem Publikum.",fuerwen:"An das deutsche Volk (über Radio) – zur Mobilisierung.",warum:"Um trotz der Niederlage Durchhaltewillen und Zustimmung zum „totalen Krieg“ zu erzeugen."},
  auftraege:[
   {afb:1,q:"**Fasse** die Rede in zwei Sätzen **zusammen**.",muster:"Goebbels fragt das Publikum, ob es an den Sieg glaubt und den „totalen Krieg“ mit härtesten Anstrengungen will. Er ruft das Volk zum Aufstehen und zum Kampf auf."},
   {afb:2,q:"**Erläutere**, mit welchen sprachlichen Mitteln Goebbels Zustimmung erzeugt.",muster:"Rhetorische Fragen („Ich frage euch …“) erzwingen ein „Ja“. Die Wiederholung desselben Satzanfangs steigert die Spannung. Die direkte Anrede „euch“ erzeugt Gemeinschaft, Steigerungen („totaler und radikaler“, „zehn, zwölf … sechzehn Stunden“) heizen die Stimmung an. Am Ende steht ein emotionaler Aufruf („Volk, steh auf“)."},
   {afb:3,q:"**Beurteile**, ob das „Ja“ des Publikums die Meinung der Deutschen zeigte.",muster:"Nein. Das Publikum war ausgewählt und aufgeheizt; die Fragen ließen kaum ein „Nein“ zu, und offener Widerspruch war gefährlich. Die Zustimmung wurde inszeniert und über das Radio verbreitet, um Durchhaltewillen nach Stalingrad zu erzeugen. Über die tatsächliche Stimmung der Bevölkerung sagt sie wenig aus."}]},

addStation({
 id:"a3", nr:"3", ic:"🎽", color:"#a5713a", status:"pflicht",
 title:"Formierung der Jugend (HJ & BDM)",
 buch:"KONTEXT · Gesetz über die HJ",
 komp:["SK","MK"],
 leit:"Wie wollte das Regime schon die Jugend an sich binden?",
 kann:["Ich kann HJ und BDM und ihre Ziele beschreiben.","Ich kann erklären, wozu die Jugend erzogen wurde.","Ich kann das HJ-Gesetz als Quelle auswerten."],
 begriffe:["Hitlerjugend","BDM","Jugenddienstpflicht","Volksgemeinschaft","Führerprinzip"],
 texte:{
  n1:["Die **Nationalsozialisten** **wollten** schon die **Jugend** für sich **gewinnen**. Fast alle **Jungen** **kamen** in die **Hitlerjugend** (**HJ**). Fast alle **Mädchen** **kamen** in den **Bund Deutscher Mädel** (**BDM**).",
      "In der **HJ** **lernten** **Jungen** **Gehorsam**. Sie **übten** schon für den **Krieg**: **Marschieren**, **Geländespiele**, **Schießen**. **Mädchen** im **BDM** **sollten** vor allem gute **Mütter** werden.",
      "Ab 1936 war die **HJ** die einzige **Jugendorganisation**. Ab 1939 war die **Mitgliedschaft** **Pflicht**. Viele **fanden** **Uniform**, **Fahrten** und **Gemeinschaft** toll – dahinter **stand** aber immer die **Erziehung** zum **Gehorsam**."],
  n2:["Die Nationalsozialisten wollten schon die Jugend für sich gewinnen. Fast alle Jungen kamen in die Hitlerjugend (HJ), fast alle Mädchen in den Bund Deutscher Mädel (BDM).",
      "In der HJ lernten Jungen Gehorsam und wurden vormilitärisch geschult: Marschieren, Geländespiele, Schießen. Mädchen im BDM wurden auf die „Mutterrolle\" und den Dienst an der „Volksgemeinschaft\" ausgerichtet.",
      "1936 wurde die HJ zur Staatsjugend, 1939 galt die Jugenddienstpflicht – die Mitgliedschaft war nun faktisch Zwang. Viele Jugendliche fanden Uniform, Fahrten und Gemeinschaft anziehend; zugleich verdrängte die HJ den Einfluss von Elternhaus und Schule und erzog zu Gehorsam und Opferbereitschaft."],
  n3:["Die NS-Jugendpolitik zielte auf die lückenlose Erfassung und ideologische Formung der Jugend in HJ und BDM. Das „Gesetz über die Hitlerjugend\" (1936) und die Jugenddienstpflicht (1939) machten die Mitgliedschaft zur Zwangsmitgliedschaft.",
      "Erziehung bedeutete Gehorsam und – für Jungen – vormilitärische Ausbildung, während Mädchen auf die „Mutterrolle\" ausgerichtet wurden; Eliteschulen (Napola, Adolf-Hitler-Schulen) ergänzten das System.",
      "Zwischen Faszination (Uniform, Gemeinschaft, Aufwertung der Jugend) und Zwang bestand ein Spannungsfeld. Die HJ verdrängte konkurrierende Bindungen (Elternhaus, Kirche, Schule) und bereitete die Jugend gezielt auf Krieg und „Volksgemeinschaft\" vor."]},

  n2:["Nach 1933 sank die Arbeitslosigkeit – das Regime feierte das als seinen Erfolg. Ein bekanntes Beispiel war der Bau der Reichsautobahn, den die Propaganda als „Arbeit für alle\" zeigte.",

  n3:["Die wirtschaftliche „Erholung\" nach 1933 war eng mit der Aufrüstung verbunden. Prestigeprojekte wie die Reichsautobahn wurden propagandistisch als „Arbeit für alle\" inszeniert, obwohl ihr Beschäftigungseffekt begrenzt blieb und ihr wirtschaftlicher wie militärischer Nutzen umstritten ist.",

addStation({

 texte:{
  n1:["Ab 1933 **wurde** das **Leben** der **Juden** in **Deutschland** immer **schwerer**. Der **Staat** **grenzte** sie **aus**.",
      "1933: **Boykott** jüdischer **Geschäfte** und **Berufsverbote**. 1935: Die **Nürnberger Gesetze** **nahmen** den **Juden** viele **Rechte**. 1938: Beim **Novemberpogrom** **brannten** die **Synagogen**.",
      "Viele **Juden** **wollten** **auswandern**. Doch das war **schwer**: Der **Staat** **nahm** ihnen fast ihr ganzes **Geld**, und andere **Länder** **nahmen** kaum jemanden **auf**. So **saßen** viele in der **Falle**."],
  n2:["Ab 1933 grenzte der NS-Staat die jüdische Bevölkerung Schritt für Schritt aus. Zuerst folgten der Boykott (1. April 1933) und der „Arierparagraph\" (Berufsverbote).",
      "1935 machten die Nürnberger Gesetze Juden zu Menschen „zweiter Klasse\" (kein volles Bürgerrecht, Eheverbote). Beim Novemberpogrom 1938 zerstörten die Nationalsozialisten Synagogen und Geschäfte, viele Menschen wurden verhaftet; danach wurden Juden aus dem Wirtschaftsleben gedrängt („Arisierung\").",
      "Das Regime wollte die Juden zur Auswanderung zwingen. Doch die Ausreise war fast unmöglich: Hohe Sonderabgaben (u. a. „Reichsfluchtsteuer\") plünderten die Auswanderer aus, und kaum ein Land nahm Flüchtlinge auf (Évian-Konferenz 1938). Bis 1939 war die jüdische Bevölkerung entrechtet und beraubt – und konnte doch kaum entkommen."],
  n3:["Zwischen 1933 und 1939 radikalisierte sich die Judenverfolgung in Stufen: Ausgrenzung und Entrechtung (Boykott 1933, „Arierparagraph\"), die pseudobiologische Entrechtung durch die Nürnberger Gesetze (1935) sowie Pogrom und „Arisierung\" (1938).",
      "Die NS-Politik zielte zunächst auf die erzwungene Auswanderung. Diese wurde jedoch systematisch erschwert: Vermögensabgaben (Reichsfluchtsteuer, „Judenvermögensabgabe\" nach 1938) beraubten die Ausreisenden, während die internationale Aufnahmebereitschaft gering blieb (Évian-Konferenz 1938).",
      "So entstand die paradoxe Lage, dass Menschen zur Ausreise gedrängt, zugleich aber ausgeplündert und kaum aufgenommen wurden – viele saßen in der Falle. (Mit Kriegsbeginn kippte die Politik: 1941 folgte das generelle Ausreiseverbot – der Übergang zur Deportation.)"]},

 quelle:{

  text:["Reichsbürgergesetz, § 2 (1): Reichsbürger ist nur der Staatsangehörige deutschen oder artverwandten Blutes […]. (3) Der Reichsbürger ist der alleinige Träger der vollen politischen Rechte […].",
   "Gesetz zum Schutze des deutschen Blutes und der deutschen Ehre, § 1 (1): Eheschließungen zwischen Juden und Staatsangehörigen deutschen oder artverwandten Blutes sind verboten.",
   "§ 2: Außerehelicher Verkehr zwischen Juden und Staatsangehörigen deutschen oder artverwandten Blutes ist verboten."],
  angabe:"Nürnberger Gesetze, 15.9.1935 (Auszüge). RGBl. 1935 I, S. 1146 f.",
  art:"Textquelle · Primärquelle (Gesetzestext aus der Zeit).",
  felder:{wer:"Die NS-Reichsregierung/„Reichstag\" (amtliche Gesetze).",wann:"15. September 1935.",wo:"Deutsches Reich (verkündet in Nürnberg).",fuerwen:"Für Behörden und Bevölkerung – rechtlich verbindlich.",warum:"Um Juden rechtlich zu entrechten und pseudobiologisch auszugrenzen."},

   {afb:2,q:"**Erläutere**, warum die Einteilung der Menschen nach „Blut“ unwissenschaftlich und willkürlich ist.",muster:"„Blut“ oder „Rasse“ sind keine biologischen Kategorien, mit denen man Menschen einteilen kann. Die Gesetze erfanden eine pseudobiologische Unterscheidung. Sie diente allein dazu, Juden auszugrenzen und zu Bürgern „zweiter Klasse“ zu machen."},
   {afb:3,q:"**Beurteile**, warum diese Gesetze Unrecht waren, obwohl sie als „Gesetze“ beschlossen wurden.",muster:"Die Gesetze hatten zwar eine rechtliche Form, verletzten aber die Gleichheit und Würde aller Menschen. Juden wurden nicht wegen einer Tat, sondern allein wegen einer erfundenen „Rasse“ entrechtet. Ein Gesetz, das Menschen ihre Grundrechte nimmt, ist Unrecht – auch wenn ein Staat es beschließt."}]},
